[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "industrial-autonomous-diagnosis-agent"
version = "0.1.0"
description = "Original synthetic conveyor diagnosis with bounded ReAct and real OWL reasoning"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.34", "pydantic>=2.10", "httpx>=0.28",
  "langgraph==1.2.5", "numpy>=2.0", "owlready2>=0.48", "pyyaml>=6.0", "typer>=0.15",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
industrial-diagnosis = "industrial_diagnosis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/industrial_diagnosis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["industrial_diagnosis"]
